<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>봄봄클래스</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>🌸 봄봄클래스</h1>
        <nav class="nav">
          <a href="shadowing.html">👂 쉐도잉</a>
          <a href="echo.html">🦜 따라하기</a>
          <a href="reading.html">📖 읽기</a>
          <a href="writing.html">✍️ 쓰기</a>
          <a href="speaking.html">🗣️ 말하기</a>
          <a href="index.html">🎙️ 회화</a>
          <a href="listen.html">🎧 복습</a>
          <a href="verb.html">🎯 동사</a>
          <a href="sentence.html">🧩 문형</a>
          <a href="teacher.html">👩‍🏫 과외</a>
          <a href="bombom.html" class="active">🌸 봄봄</a>
        </nav>
        <div class="controls">
          <label class="voice-select">
            음성
            <select id="voiceSelect"></select>
          </label>
          <div class="speed">
            <span class="speed-caption">속도</span>
            <button type="button" id="slower" title="느리게">🐢</button>
            <span id="speedVal" class="speed-val">0.9x</span>
            <button type="button" id="faster" title="빠르게">🐇</button>
          </div>
          <input id="rate" type="hidden" value="0.9" />
        </div>
      </header>

      <div class="listen-bar">
        <label class="opt">
          강의
          <select id="lessonSelect"></select>
        </label>
        <button id="audioBtn" class="stop" title="원어민 음원 재생/정지">🎧 원어민 음원</button>
        <button id="readAllBtn" class="stop" title="영어 본문 전체 읽기">🔊 영어 전체 읽기</button>
        <span class="opt hint-drag">💡 한글을 보고 영작한 뒤 '정답 확인'을 눌러요</span>
      </div>

      <audio id="nativeAudio" preload="none"></audio>

      <main class="bombom-main">
        <div id="progress" class="bombom-progress"></div>
        <div class="shadow-card">
          <div id="speaker" class="bombom-speaker" style="display: none"></div>
          <div id="koPrompt" class="q-text bombom-ko">강의를 선택하면 시작합니다.</div>

          <form id="answerForm" class="answer-form">
            <textarea
              id="answerInput"
              rows="2"
              placeholder="위 한글을 영어로 써보세요 (Enter=확인, Shift+Enter=줄바꿈)"
            ></textarea>
            <div class="bombom-btns">
              <button type="button" id="hintBtn" class="stop" title="정답 영어를 들려줘요">🔊 영어 듣기(힌트)</button>
              <button type="submit" id="checkBtn">✅ 정답 확인</button>
            </div>
          </form>

          <div id="result" class="shadow-result"></div>
        </div>

        <div class="bombom-nav">
          <button id="prevBtn" class="stop">◀ 이전</button>
          <button id="nextBtn" class="mic">다음 ▶</button>
        </div>
      </main>

      <div id="status" class="status">강의를 선택하세요.</div>
    </div>

    <!-- 드래그 반복/번역 안내 -->
    <div id="tip" class="tip"></div>

    <script src="speed.js"></script>
    <script src="bombom.js"></script>
    <script src="accent.js"></script>
    <script src="ask.js"></script>
  </body>
</html>

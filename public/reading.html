<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>읽기 연습</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>📖 읽기 연습</h1>
        <nav class="nav">
          <a href="shadowing.html">👂 쉐도잉</a>
          <a href="echo.html">🦜 따라하기</a>
          <a href="reading.html" class="active">📖 읽기</a>
          <a href="writing.html">✍️ 쓰기</a>
          <a href="speaking.html">🗣️ 말하기</a>
          <a href="index.html">🎙️ 회화</a>
          <a href="listen.html">🎧 복습</a>
          <a href="verb.html">🎯 동사</a>
          <a href="sentence.html">🧩 문형</a>
          <a href="teacher.html">👩‍🏫 과외</a>
          <a href="bombom.html?c=guiddulki">🎧 귀뚫기</a>
          <a href="bombom.html?c=bombom">🌸 봄봄</a>
        </nav>
        <div class="controls">
          <label class="voice-select">
            음성
            <select id="voiceSelect"></select>
          </label>
          <div class="speed">
            <span class="speed-caption">속도</span>
            <button type="button" id="slower" title="느리게">🐢</button>
            <span id="speedVal" class="speed-val">0.9x</span>
            <button type="button" id="faster" title="빠르게">🐇</button>
          </div>
          <input id="rate" type="hidden" value="0.9" />
        </div>
      </header>

      <div class="listen-bar">
        <button id="startBtn" class="mic">▶️ 시작 (지문 만들기)</button>
        <button id="reviewBtn" class="stop">🔁 복습 (내가 읽은 지문)</button>
        <button id="readAllBtn" class="stop" disabled>🔊 전체 읽어주기</button>
        <div class="mode-group" id="viewMode">
          <button type="button" data-mode="en" class="active" disabled>영어</button>
          <button type="button" data-mode="both" disabled>영어+한글</button>
          <button type="button" data-mode="ko" disabled>한글만</button>
          <button type="button" data-mode="listen" disabled>🎧 듣기만</button>
        </div>
        <label class="opt">
          글자 크기
          <select id="fontSize">
            <option value="1">보통</option>
            <option value="1.15" selected>크게</option>
            <option value="1.3">아주 크게</option>
          </select>
        </label>
        <span class="opt hint-drag">💡 마우스로 드래그하면 그 부분만 바로 해석돼요</span>
      </div>

      <main class="reading-main">
        <article id="passage" class="passage">
          <div class="reading-empty">
            <b>▶️ 시작</b> 을 누르면 초중급 수준의 지문(약 A4 1페이지)이 만들어집니다.<br />
            소리 내어 읽으며 연습해 보세요.
          </div>
        </article>
        <div id="listenHint" class="listen-hint" style="display: none">
          🎧 지문을 숨겼어요.<br />
          잘 듣고, 확인하려면 위에서 <b>영어</b> 를 누르세요.
        </div>
      </main>

      <div id="status" class="status">준비되었습니다.</div>
    </div>

    <!-- 드래그 번역 말풍선 -->
    <div id="tip" class="tip"></div>

    <script src="speed.js"></script>
    <script src="library.js"></script>
    <script src="reading.js"></script>
    <script src="accent.js"></script>
    <script src="theme.js"></script>
    <script src="review-mode.js"></script>
    <script src="ask.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily English Teacher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>👩‍🏫 Daily English Teacher</h1>
        <nav class="nav">
          <a href="shadowing.html">👂 쉐도잉</a>
          <a href="echo.html">🦜 따라하기</a>
          <a href="reading.html">📖 읽기</a>
          <a href="writing.html">✍️ 쓰기</a>
          <a href="speaking.html">🗣️ 말하기</a>
          <a href="index.html">🎙️ 회화</a>
          <a href="listen.html">🎧 복습</a>
          <a href="verb.html">🎯 동사</a>
          <a href="sentence.html">🧩 문형</a>
          <a href="teacher.html" class="active">👩‍🏫 과외</a>
          <a href="bombom.html">🌸 봄봄</a>
        </nav>
        <div class="controls">
          <label class="voice-select">
            음성
            <select id="voiceSelect"></select>
          </label>
          <div class="speed">
            <span class="speed-caption">속도</span>
            <button type="button" id="slower" title="느리게">🐢</button>
            <span id="speedVal" class="speed-val">0.9x</span>
            <button type="button" id="faster" title="빠르게">🐇</button>
          </div>
          <input id="rate" type="hidden" value="0.9" />
        </div>
      </header>

      <div class="listen-bar">
        <button id="startBtn" class="mic">▶️ 수업 시작하자</button>
        <button id="endBtn" class="stop">🏁 오늘 수업 끝</button>
        <button id="resetBtn" class="stop" title="학습 기록·대화 모두 지우기">🗑️ 기록 초기화</button>
        <span class="opt hint-drag">💡 영어를 쓰거나 🎤로 말하면 교정해줘요 · 답변에서 영어를 드래그하면 발음을 들려줘요</span>
      </div>

      <main id="chat" class="chat teacher-chat"></main>

      <div id="status" class="status">👩‍🏫 "수업 시작하자" 를 누르면 오늘 수업이 시작됩니다.</div>

      <footer>
        <button id="micBtn" class="mic" title="말하기">
          <span class="mic-icon">🎤</span>
          <span class="mic-label">말하기</span>
        </button>
        <form id="textForm" class="text-form">
          <textarea
            id="textInput"
            rows="1"
            placeholder="여기에 영어로 입력 (Enter=보내기, Shift+Enter=줄바꿈)"
            autocomplete="off"
          ></textarea>
          <button type="submit">보내기</button>
        </form>
        <button id="stopBtn" class="stop" title="읽기 멈춤">🔇</button>
      </footer>
    </div>

    <script src="speed.js"></script>
    <script src="teacher.js"></script>
    <script src="accent.js"></script>
    <script src="ask.js"></script>
  </body>
</html>
